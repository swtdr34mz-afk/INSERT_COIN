# INSERT COIN build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "insertcoin"               # the build's file names: insertcoin-0.1.fwsc, build/host/insertcoin_host
title = "INSERT COIN"             # the name people see (firmware hubs)
id_prefix = "FM-1_573"          # package identity: dev FM-1_57300, releases FM-1_573 + XXYYZZ (CHORD RUN 571, GRAIN PIANO 572)
usb_manufacturer = "swtdr34mz"
usb_product = "INSERT COIN FM-1"  # the USB name (the MIDI port in Ableton)
o2 = ["dsp/engine.c"]           # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]        # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
font_full = ["L"]               # lower case in the big font: chord names (Am7, Cmaj9, sus4)
ble = false
backup = true                   # backup and restore of the settings, the progress and the user grooves
gen = ["tools/gen_title.py --out {gen}/title_data.h"]   # the intro's pixel title
tagline = "Chiptune chord player with an arcade shooter"
repo = "https://github.com/swtdr34mz-afk/PIXEL_RUN"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments); title type Press Start 2P (CodeMan38, SIL OFL 1.1)."
author = "swtdr34mz (based on Blop by Obsimo)"
description = "CHORD RUN's chiptune sibling, with an 80s arcade shooter on the screen that fires on every key you play. One-finger chords: 20 sets of game-style chord progressions on the black keys, each its own level with its own sound, rhythm and scale; the white keys play a melody that follows the chord. Chip sounds (pulse, PWM, wave, stepped triangle, 16-bit FM), Game Boy style drums in 20 grooves and a DRUM STUDIO (16 steps, 4 tracks, 20 user slots); bitcrusher, delay, chorus, reverb; an 8-bar chord looper. Chords and bass out over USB MIDI."
tags = ["chords", "drum-machine", "synth", "midi", "game"]
install = "https://github.com/swtdr34mz-afk/PIXEL_RUN/releases"
screenshot = "site/img/screen-main.png"
